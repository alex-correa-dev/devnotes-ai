name: devnotes-ai

services:
  mongodb:
    image: mongodb/mongodb-atlas-local:latest
    container_name: devnotes-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=admin
      - MONGODB_INITDB_ROOT_PASSWORD=admin
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - devnotes

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: devnotes-api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - API_PORT=4000
      - MONGODB_URI=mongodb://admin:admin@mongodb:27017/devnotes?authSource=admin&directConnection=true
      - MONGODB_DB_NAME=devnotes
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - devnotes

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/graphql
    container_name: devnotes-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000/graphql
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - devnotes

volumes:
  mongodb-data:
    driver: local

networks:
  devnotes:
    driver: bridge