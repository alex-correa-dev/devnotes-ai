scalar DateTime

type Note {
  id: ID!
  title: String!
  content: String!
  tags: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateNoteInput {
  title: String!
  content: String!
  tags: [String!] = []
}

input UpdateNoteInput {
  title: String
  content: String
  tags: [String!]
}

type Query {
  notes: [Note!]!
  note(id: ID!): Note
}

type Mutation {
  createNote(input: CreateNoteInput!): Note!
  updateNote(id: ID!, input: UpdateNoteInput!): Note!
  deleteNote(id: ID!): Boolean!
}