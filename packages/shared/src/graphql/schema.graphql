scalar DateTime

type Note {
  id: ID!
  title: String!
  content: String!
  tags: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type NoteSearchResult {
  notes: [Note!]!
  total: Int!
}

input CreateNoteInput {
  title: String!
  content: String!
  tags: [String!] = []
}

input UpdateNoteInput {
  title: String
  content: String
  tags: [String!]
}

input SearchNotesInput {
  query: String!
  tags: [String!]
  limit: Int
  skip: Int
}

type Query {
  notes: [Note!]!
  note(id: ID!): Note
  searchNotes(input: SearchNotesInput!): NoteSearchResult!
  autocompleteNotes(prefix: String!, limit: Int): [String!]!
}

type Mutation {
  createNote(input: CreateNoteInput!): Note!
  updateNote(id: ID!, input: UpdateNoteInput!): Note!
  deleteNote(id: ID!): Boolean!
}