apiVersion: apps/v1
kind: Deployment
metadata:
  name: devnotes-web
  namespace: devnotes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devnotes-web
  template:
    metadata:
      labels:
        app: devnotes-web
    spec:
      containers:
        - name: web
          image: devnotes-ai-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "http://api.devnotes.local:8080/graphql"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: devnotes-web-svc
  namespace: devnotes
spec:
  type: ClusterIP
  selector:
    app: devnotes-web
  ports:
    - port: 3000
      targetPort: 3000