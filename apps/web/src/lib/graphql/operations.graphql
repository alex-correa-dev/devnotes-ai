query ListNotes {
  notes {
    id
    title
    content
    tags
    createdAt
    updatedAt
  }
}

query GetNote($id: ID!) {
  note(id: $id) {
    id
    title
    content
    tags
    createdAt
    updatedAt
  }
}

query SearchNotes($input: SearchNotesInput!) {
  searchNotes(input: $input) {
    total
    notes {
      id
      title
      content
      tags
      createdAt
      updatedAt
    }
  }
}

query AutocompleteNotes($prefix: String!, $limit: Int) {
  autocompleteNotes(prefix: $prefix, limit: $limit)
}

mutation CreateNote($input: CreateNoteInput!) {
  createNote(input: $input) {
    id
    title
    content
    tags
    createdAt
    updatedAt
  }
}

mutation DeleteNote($id: ID!) {
  deleteNote(id: $id)
}